data:
  train_path: data/train_dataset.csv
  test_path: data/test_dataset.csv
  external:
    # До положительного A/B-теста production/submission остаётся без external.
    enabled: false
    usage: training_only
    sources:
      - name: zernograd_osm
        enabled: true
        path: data/external/processed/zernograd_2019_2024.csv
        crop_type_fallback: неизвестно
        polygon_id_prefix: EXT-ZGD-
        sample_weight: 0.50
      - name: egorlykskaya_osm
        # Будет включён после сбора; вес можно менять независимо через CLI.
        enabled: false
        path: data/external/processed/egorlykskaya_2019_2024.csv
        crop_type_fallback: неизвестно
        polygon_id_prefix: EXT-EGL-
        sample_weight: 0.25

features:

  neighbors:
    enabled: true
    count: 2
    include_distances: true
  interpolation:
    baseline: true
    linear: true
    pchip: true
    local_quadratic: false
    differences: false
    agreement: false

  polygon_history:
    enabled: true
    calculation: provided
    doy_window: 21
    weighting_scale: 7.0
    include_std: true
    include_reference_years: true
    expanded_statistics: false
    doy_windows: [7, 14, 21]
    recent_year_scale: 2.0

  crop_curve:
    enabled: true
    doy_window: 7
    weighting_scale: 3.0
    aggregation: median

  calendar:
    enabled: true
    include_doy: true
    cyclic_encoding: true
    include_year: true

  crop_type:
    enabled: true
    encoding: one_hot

  temporal_dynamics:
    enabled: true
    gap_geometry: true
    slopes: true
    acceleration: true
    local_statistics: true

training:
  # residual доступен, но direct пока показывает лучший локальный RMSE.
  target_mode: direct
  residual_baseline: linear
  gap_masking:
    strategy: leave_one_out
    target_fraction: 0.15
    replicas: 5
    block_length_weights:
      1: 0.922
      2: 0.070
      3: 0.007
      4: 0.0005
      5: 0.0005
    random_state: 42

models:
  selected: routed_lightgbm
  on_unavailable: fallback
  fallback_to: ensemble
  available:
    baseline:
      type: baseline
      params:
        method: neighbor_mean
    ensemble:
      type: heuristic_ensemble
      params:
        baseline_weight_near: 0.86
        baseline_weight_far: 0.72
        historical_weight: 0.22
        crop_curve_weight: 0.06
    lightgbm:
      type: lightgbm
      artifact_path: artifacts/models/lightgbm.joblib
      load_if_exists: true
      params:
        n_estimators: 350
        learning_rate: 0.035
        num_leaves: 24
        min_child_samples: 40
        colsample_bytree: 0.9
        reg_lambda: 2.0
        verbosity: -1
        random_state: 42
    routed_lightgbm:
      type: history_routed_lightgbm
      artifact_path: artifacts/models/routed_lightgbm.joblib
      load_if_exists: true
      params:
        min_reference_years: 1
        common_params:
          n_estimators: 350
          learning_rate: 0.035
          num_leaves: 24
          min_child_samples: 40
          colsample_bytree: 0.9
          reg_lambda: 2.0
          verbosity: -1
          random_state: 42
        history_rich_params: {}
        cold_start_params: {}
    catboost:
      type: catboost
      artifact_path: artifacts/models/catboost.joblib
      load_if_exists: true
      params:
        iterations: 500
        depth: 7
        learning_rate: 0.03
        loss_function: RMSE
        random_seed: 42
        verbose: false
    random_forest:
      type: random_forest
      artifact_path: artifacts/models/random_forest.joblib
      load_if_exists: true
      params:
        n_estimators: 400
        max_depth: 14
        min_samples_leaf: 5
        n_jobs: -1
        random_state: 42

predict:
  output_path: artifacts/submission.csv
  prediction_column: primary_ndvi_true

validation:
  sample_size: 3000
  seed: 42
  evaluation_source: competition_only
  external_ab:
    seeds: [17, 42, 73]
    disable_crop_features: true

server:
  host: 127.0.0.1
  port: 8000
  auto_select_port: true
  open_browser: true
  debug: false
