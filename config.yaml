data:
  train_path: data/train_dataset.csv
  test_path: data/test_dataset.csv
  external:
    # До положительного A/B-теста production/submission остаётся без external.
    enabled: false
    usage: training_only
    sources:
      - name: zernograd_osm
        enabled: true
        path: data/external/processed/zernograd_2019_2024.csv
        crop_type_fallback: неизвестно
        polygon_id_prefix: EXT-ZGD-
        sample_weight: 0.50
      - name: egorlykskaya_osm
        # Будет включён после сбора; вес можно менять независимо через CLI.
        enabled: false
        path: data/external/processed/egorlykskaya_2019_2024.csv
        crop_type_fallback: неизвестно
        polygon_id_prefix: EXT-EGL-
        sample_weight: 0.25

features:

  neighbors:
    enabled: true
    count: 2
    include_distances: true
  interpolation:
    baseline: true
    linear: true
    pchip: true
    local_quadratic: false
    differences: false
    agreement: false

  polygon_history:
    enabled: true
    calculation: provided
    doy_window: 21
    weighting_scale: 7.0
    include_std: true
    include_reference_years: true
    expanded_statistics: false
    doy_windows: [7, 14, 21]
    recent_year_scale: 2.0

  crop_curve:
    enabled: true
    doy_window: 7
    weighting_scale: 3.0
    aggregation: median

  calendar:
    enabled: true
    include_doy: true
    cyclic_encoding: true
    include_year: true

  crop_type:
    enabled: true
    encoding: one_hot

  # Замер на платформе: те же модель и обучение, отличие только в этих
  # признаках, дало 0.0782 против 0.0778. Признаки стоят +0.0004, выключены.
  temporal_dynamics:
    enabled: false
    gap_geometry: true
    slopes: true
    acceleration: true
    local_statistics: true

training:
  # residual доступен, но direct пока показывает лучший локальный RMSE.
  target_mode: direct
  residual_baseline: linear
  gap_masking:
    strategy: leave_one_out
    target_fraction: 0.15
    replicas: 5
    block_length_weights:
      1: 0.922
      2: 0.070
      3: 0.007
      4: 0.0005
      5: 0.0005
    random_state: 42

models:
  selected: lightgbm_sensor
  on_unavailable: fallback
  fallback_to: ensemble
  # Обучение дополнительно на наблюдённых точках тестового файла. Это выданные
  # признаки, а не ответы: контрольные строки в контексте уже равны NaN.
  # В новом тесте все 20 полигонов отсутствуют в train, поэтому без этого
  # модель переносится на них вслепую. Замер: 0.060538 -> 0.058215,
  # 95% ДИ [-0.0031, -0.0016].
  transductive: true
  available:
    baseline:
      type: baseline
      params:
        method: neighbor_mean
    ensemble:
      type: heuristic_ensemble
      params:
        baseline_weight_near: 0.86
        baseline_weight_far: 0.72
        historical_weight: 0.22
        crop_curve_weight: 0.06
    lightgbm:
      type: lightgbm
      artifact_path: artifacts/models/lightgbm.joblib
      load_if_exists: true
      params:
        n_estimators: 350
        learning_rate: 0.035
        num_leaves: 24
        min_child_samples: 40
        colsample_bytree: 0.9
        reg_lambda: 2.0
        verbosity: -1
        random_state: 42
    routed_lightgbm:
      type: history_routed_lightgbm
      artifact_path: artifacts/models/routed_lightgbm.joblib
      load_if_exists: true
      params:
        min_reference_years: 1
        common_params:
          n_estimators: 350
          learning_rate: 0.035
          num_leaves: 24
          min_child_samples: 40
          colsample_bytree: 0.9
          reg_lambda: 2.0
          verbosity: -1
          random_state: 42
        history_rich_params: {}
        cold_start_params: {}
    # Метамодель с сенсорными признаками: вероятности источника по орбитальному
    # календарю плюс соседи по ряду каждого сенсора. Обучается через код
    # инференса на сгенерированных масках, поэтому получает и признаки
    # temporal_dynamics из общего FeatureBuilder.
    lightgbm_sensor:
      type: lightgbm_sensor
      artifact_path: artifacts/models/lightgbm_sensor.joblib
      load_if_exists: true
      params:
        per_sensor: true
        # Срез по остальным полигонам на ту же дату. Восстанавливает погоду,
        # скрытую платформой у контрольной точки (температура: RMSE 0.88 C,
        # корреляция 0.9911), и даёт региональный уровень вегетации.
        # Парный замер, 13 765 целей: 0.065202 -> 0.063318,
        # 95% ДИ [-0.00237, -0.00139].
        peer_date: true
        n_masks: 10
        mask_rate: 0.15
        mask_seed: 1000
        classifier_masks: 6
        classifier_seed: 5000
        n_estimators: 900
        learning_rate: 0.035
        num_leaves: 48
        min_child_samples: 20
        colsample_bytree: 0.4
        reg_lambda: 5.0
        verbosity: -1
        random_state: 42
        classifier:
          n_estimators: 300
          learning_rate: 0.05
          num_leaves: 31
          verbosity: -1
          random_state: 42

    # Те же сенсорные признаки и та же схема обучения, другое семейство
    # регрессора. Смысл — не улучшить одиночный RMSE, а декоррелировать ошибки:
    # блендинг выигрывает от несходства моделей, а не от их количества.
    sensor_extra_trees:
      type: lightgbm_sensor
      artifact_path: artifacts/models/sensor_extra_trees.joblib
      load_if_exists: true
      params:
        estimator: extra_trees
        per_sensor: true
        n_masks: 10
        mask_rate: 0.15
        mask_seed: 1000
        classifier_masks: 6
        classifier_seed: 5000
        n_estimators: 400
        min_samples_leaf: 3
        max_features: 0.5
        n_jobs: -1
        random_state: 42
        classifier:
          n_estimators: 300
          learning_rate: 0.05
          num_leaves: 31
          verbosity: -1
          random_state: 42

    sensor_catboost:
      type: lightgbm_sensor
      artifact_path: artifacts/models/sensor_catboost.joblib
      load_if_exists: true
      params:
        estimator: catboost
        per_sensor: true
        n_masks: 10
        mask_rate: 0.15
        mask_seed: 1000
        classifier_masks: 6
        classifier_seed: 5000
        iterations: 900
        depth: 7
        learning_rate: 0.04
        loss_function: RMSE
        random_seed: 42
        verbose: false
        classifier:
          n_estimators: 300
          learning_rate: 0.05
          num_leaves: 31
          verbosity: -1
          random_state: 42

    catboost:
      type: catboost
      artifact_path: artifacts/models/catboost.joblib
      load_if_exists: true
      params:
        iterations: 500
        depth: 7
        learning_rate: 0.03
        loss_function: RMSE
        random_seed: 42
        verbose: false
    random_forest:
      type: random_forest
      artifact_path: artifacts/models/random_forest.joblib
      load_if_exists: true
      params:
        n_estimators: 400
        max_depth: 14
        min_samples_leaf: 5
        n_jobs: -1
        random_state: 42

predict:
  output_path: artifacts/submission.csv
  prediction_column: primary_ndvi_true

validation:
  sample_size: 3000
  seed: 42
  evaluation_source: competition_only
  external_ab:
    seeds: [17, 42, 73]
    disable_crop_features: true

# Оценка на синтетических пропусках, воспроизводящих процесс платформы:
# независимая маскировка 15% наблюдений и половина полигонов вне обучения.
benchmark:
  repeats: 3
  mask_rate: 0.15
  seed: 42
  holdout_fraction: 0.5

# Сбор внешних данных через Earth Engine. Ключ в репозиторий не кладётся.
collect:
  key_path: null
  project: null

server:
  host: 127.0.0.1
  port: 8000
  auto_select_port: true
  open_browser: true
  debug: false
