# Страница отправки решений Космохакатона.
submission_url: https://рнд.космохакатон.рф/personal/solution

browser:
  headless: false
  # Постоянный профиль принадлежит только Selenium-сабмиттеру.
  profile_dir: artifacts/submissions/session/chrome-profile
  profile_name: Default
  # Chrome сам хранит cookies в постоянном профиле; второе хранилище отключено.
  cookies_path:
  # После полной загрузки даём JavaScript страницы завершить инициализацию.
  settle_delay: 1.0
  page_timeout: 30
  # В видимом браузере можно вручную войти в аккаунт при первом запуске.
  login_timeout: 180
  # Платформа блокирует повторную отправку примерно на одну минуту.
  cooldown_timeout: 90
  cooldown_poll_interval: 1.0
  result_timeout: 180
  # Обязательная пауза сразу после клика по кнопке отправки.
  result_settle_delay: 4.0
  driver_log_path: artifacts/submissions/logs/chromedriver.log

authentication:
  credentials_path: api/credentials.env
  email_selector: "#email"
  password_selector: "#password"
  submit_button_selector: "button.btnLoginCSS"
  error_selector: ".error-message, .alert, .alert-danger, .invalid-feedback"
  input_delay: 0.25
  manual_login_timeout: 300

selectors:
  file_input: "#solution-file"
  submit_button: "#save-solution-btn-metrika"
  # Отдельный маркер успеха не нужен: обычная HTML-форма перезагружает страницу.
  success_marker:
  # Жёлтый .alert-warning после успешного POST сообщает о новом кулдауне и
  # не является ошибкой. Ошибками считаем только danger/invalid элементы.
  failure_marker: ".error-message, .alert-danger, .invalid-feedback"
  submission_id:
  score:
  result_row: "tbody tr.team-row:first-child"
  cooldown_alert: "#solution-blocked-alert"
  cooldown_timer: "#solution-blocked-timer"

validation:
  expected_columns:
    - anon_polygon_id
    - date
    - primary_ndvi_true
  identity_columns:
    - anon_polygon_id
    - date
  target_column: primary_ndvi_true
  test_data_path: data/test_dataset.csv

output:
  history_path: artifacts/submissions/history.jsonl
  log_path: artifacts/submissions/logs/submitter.log
