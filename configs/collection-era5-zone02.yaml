region:
  name: era5_zone02_agriculture
  bbox:
    min_lon: 41.05
    min_lat: 46.35
    max_lon: 41.35
    max_lat: 46.65

polygons:
  path: ../data/external/era5-zone02/polygons.geojson
  id_property: polygon_id
  id_prefix: EXT-WZ02-
  selection:
    limit: 10
    min_area_ha: 20
    max_area_ha: 500
    min_cropland_fraction: 0.80
    strategy: spatially_balanced
    min_centroid_distance_km: 5
    grid_cell_km: 10
    max_per_grid_cell: 1

field_validation:
  enabled: true
  candidate_pool_size: 30
  worldcover_collection: ESA/WorldCover/v200
  worldcover_band: Map
  cropland_class: 40
  scale_m: 10
  min_valid_sentinel2_observations: 12

period:
  start: 2024-04-01
  end: 2024-10-30

provider:
  type: earth_engine
  project_id_env: EE_PROJECT_ID

sensors:
  sentinel2:
    enabled: true
    collection: COPERNICUS/S2_SR_HARMONIZED
    scale_m: 20
    reducer: median
    max_scene_cloud_percent: 80
    min_valid_fraction: 0.60
    min_pixel_count: 50
    excluded_scl: [0, 1, 3, 7, 8, 9, 10, 11]
  landsat:
    enabled: false
  modis:
    enabled: false
  era5:
    enabled: false

output:
  raw_directory: ../artifacts/collection/era5-zone02/raw
  manifest_directory: ../artifacts/collection/era5-zone02/manifests
  dataset_path: ../data/external/processed/era5_zone02_2019_2024.csv
  format: csv

execution:
  batch_size: 5
  retries: 3
  resume: true
  overwrite: false

processing:
  climatology_window_days: 21
