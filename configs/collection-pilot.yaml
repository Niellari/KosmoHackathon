region:
  name: zernograd_agriculture_pilot
  bbox:
    min_lon: 40.0
    min_lat: 46.65
    max_lon: 40.65
    max_lat: 47.05

polygons:
  path: ../data/external/polygons.geojson
  id_property: polygon_id
  selection:
    limit: 10
    min_area_ha: 20
    max_area_ha: 500
    min_cropland_fraction: 0.80

period:
  start: 2024-04-01
  end: 2024-10-30

provider:
  type: earth_engine
  project_id_env: EE_PROJECT_ID

sensors:
  sentinel2:
    enabled: true
    collection: COPERNICUS/S2_SR_HARMONIZED
    scale_m: 20
    reducer: median
    max_scene_cloud_percent: 80
    min_valid_fraction: 0.60
    min_pixel_count: 50
    excluded_scl: [0, 1, 3, 7, 8, 9, 10, 11]
  landsat:
    enabled: false
  modis:
    enabled: false
  era5:
    enabled: false

output:
  raw_directory: ../artifacts/collection/raw
  manifest_directory: ../artifacts/collection/manifests
  dataset_path: ../data/external/processed/external_dataset.csv
  format: csv

execution:
  batch_size: 5
  retries: 3
  resume: true
  overwrite: false
